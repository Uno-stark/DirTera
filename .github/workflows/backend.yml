name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    name: Import check & startup smoke-test
    runs-on: ubuntu-latest

    env:
      # Minimal env 
      APP_NAME: DirTera
      APP_VERSION: "0.1.0"
      DEBUG: "true"
      ENVIRONMENT: "ci"
      SECRET_KEY: "ci-secret-key-not-used-in-production"
      DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
      ALLOWED_ORIGINS: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "ci"
      GOOGLE_CLIENT_SECRET: "ci"
      GOOGLE_REDIRECT_URI: "http://localhost:8000/api/v1/auth/google/callback"
      LINKSSET_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_SECRET_KEY: ""
      RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check all modules import cleanly
        run: python -c "from app.main import app; print('App imported OK')"

      - name: Run Alembic migrations (SQLite)
        run: alembic upgrade head

      - name: Smoke-test — app starts and /health responds
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 3
          curl --fail --silent http://127.0.0.1:8000/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          kill $SERVER_PID
