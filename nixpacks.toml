[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "nodejs_22"]
nixLibs = ["gcc-unwrapped"]
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"

[phases.install]
cmds = [
    "pip install -r backend/requirements.txt",
    "cd frontend && npm ci"
]

[phases.build]
cmds = [
    "cd frontend && npm run build"
]

[start]
cmd = "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
